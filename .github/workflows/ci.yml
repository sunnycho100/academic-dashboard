name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GitHub's Ubuntu runners block Chromium's sandbox; tests only.
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      - run: pnpm test
      # Fetch the Electron binary once, so parallel workers don't race to download it.
      - run: node node_modules/electron/install.js
      # Electron needs a display; xvfb provides a virtual one on Linux.
      - run: xvfb-run --auto-servernum pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
